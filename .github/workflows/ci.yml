# Lane 15 — CI-Skizze: reines Rust erzwingen.
# Lokaler Kurz-Check: ./scripts/check.sh
name: ci

on:
  push:
    branches: ["main", "lane/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets

  unsafe-verbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-geiger installieren
        run: cargo install cargo-geiger --locked
      - name: kein unsafe-Code (eigener Code + Deps ueberpruefen)
        run: |
          cargo geiger --workspace --all-targets --forbid-only
          ./scripts/check.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MSRV aus Workspace-Cargo.toml ([workspace.package] rust-version, aktuell 1.75.0).
      # Bei MSRV-Erhöhung: Version hier UND in Cargo.toml anpassen.
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --workspace --all-targets
