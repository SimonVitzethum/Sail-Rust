# Lane 67 — cargo-deny-Konfiguration (Supply-Chain-Hygiene).
#
# Prueft: Advisories (RustSec), Lizenzen, Bans, Sources.
# Aufruf lokal:  cargo deny check advisories licenses bans sources
# CI-Einbau: Job `deny-audit` in .github/workflows/ci.yml (Lane 91, vorerst
# warnend per `continue-on-error: true`, bis WORK_STATE.md-Aktionen A1–A5 stehen).
#
# Hinweis: Das Repo checkt derzeit KEIN Cargo.lock ein. `cargo deny check`
# braucht ein Lockfile (cargo generate-lockfile genuegt, kein Build).
# Stand Lane 113 (lesend, E3): A2–A5 per Review geschlossen (s. WORK_STATE.md
# Nachtrag), A1 (Lockfile) offen — `deny-audit`-Job in ci.yml bleibt bis
# dahin warnend (`continue-on-error: true`).

[graph]
# Alle Targets pruefen (auch Tests/Benches), alle Features aufloesen,
# damit die optionale z3-Abhaengigkeit (s. WORK_STATE.md, RUSTSEC-2026-0295)
# ebenfalls erfasst wird.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# RUSTSEC-DB-Abfrage laeuft uebers Netz (Lesen der Advisory-DB ist ok, E3).
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-dbs"
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
# Informational-Notices (u. a. `informational = "unsound"`, z. B.
# RUSTSEC-2022-0019 fuer crossbeam-channel): warnen, nicht blockieren.
# Die Lane-67-Frage "ban unsound Strict?" ist damit beantwortet als:
# Nein — warnend, weil `unsound`-Notices auch lang gepatchte
# Historie betreffen und sonst jede alte Transitive blockieren wuerde.
notice = "warn"
ignore = []
# Ohne eingechecktes Cargo.lock keine Version-Pins: cargo-deny nutzt das
# jeweils frisch aufgeloeste Lockfile. Sobald Cargo.lock eingecheckt ist,
# gilt der Audit gegen exakt diese Pins (s. WORK_STATE.md Aktion A1).

[licenses]
version = 2
# Policy: MIT/Apache-2.0-only (Lane-67-Vorgabe). OR-Ausdruecke passieren,
# sobald EINE Alternative erlaubt ist (z. B. blake3: CC0-1.0 OR Apache-2.0
# -> ok ueber Apache-2.0).
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
]
# SPDX-Confidence-Schwelle: niedrigere Treffer landen zur manuellen
# Klaerung in `clarify` statt still akzeptiert zu werden.
confidence-threshold = 0.8
exceptions = []
# ERLEDIGT (Lane 70, verifiziert Lane 113 per Review, E3): Alle
# Workspace-Crates deklarieren `MIT OR Apache-2.0` (direkt oder via
# `license.workspace = true`); kein BSD-Rest, kein fehlendes Feld mehr.
# Die Policy unten ist damit erfuellbar, sobald A1 (Lockfile) steht und
# der erste echte `cargo deny check licenses` laeuft.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Transitive Duplikate (erlaubt, aber sichtbar):
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
