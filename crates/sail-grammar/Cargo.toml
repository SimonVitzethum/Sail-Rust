[package]
name = "sail-grammar"
version = "0.1.0"
edition = "2021"
description = "Sail grammar ported from Menhir (.mly) to LALRPOP — skeletal AST, no semantic logic"
license = "MIT OR Apache-2.0"

[lib]
name = "sail_grammar"
path = "src/lib.rs"

[dependencies]
lalrpop-util = "0.22"

[build-dependencies]
lalrpop = "0.22"

[lints.rust]
unsafe_code = "forbid"
