[package]
name = "sail-ty"
version = "0.1.0"
edition = "2021"
description = "Sail2 typechecker core: kinds, typquants, bidirectional checking, Solver trait (Lane 05, no Z3)"
license = "MIT OR Apache-2.0"

[lib]
name = "sail_ty"
path = "src/lib.rs"

[dependencies]
sail-ast = { path = "../sail-ast" }
# MSRV 1.75: Mindestversionen pinnen (serde/serde_json mit hoeherer MSRV
# nur nach MSRV-Check in CI anheben).
serde = { version = "1.0.203", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.117"

[lints]
workspace = true
