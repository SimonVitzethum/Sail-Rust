[package]
name = "sail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sail-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sail-parse = { path = "../sail-parse" }
sail-lean = { path = "../sail-lean" }
sail-lake = { path = "../sail-lake" }
sail-regs = { path = "../sail-regs" }
sail-prelude = { path = "../sail-prelude" }
sail-ast = { path = "../sail-ast" }
sail-shard = { path = "../sail-shard" }
sail-ooc = { path = "../sail-ooc" }
sail-resolve = { path = "../sail-resolve" }
sail-rewrite = { path = "../sail-rewrite" }
sail-ty = { path = "../sail-ty" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
