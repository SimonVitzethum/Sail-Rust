[package]
name = "sail-parse"
version = "0.1.0"
edition = "2021"
description = "Sail2 source parser skeleton (hand-written, streaming per file, forbid(unsafe_code))"
license = "MIT OR Apache-2.0"

[lib]
name = "sail_parse"
path = "src/lib.rs"

[dependencies]
sail-ast = { path = "../sail-ast" }
sail-grammar = { path = "../sail-grammar" }
sail-lex = { path = "../sail-lex" }
sail-shard = { path = "../sail-shard" }

[lints]
workspace = true
