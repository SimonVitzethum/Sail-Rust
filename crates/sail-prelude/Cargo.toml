[package]
name = "sail-prelude"
version = "0.1.0"
edition = "2021"
description = "Embedded Sail prelude (sail/lib/*.sail) for the pure-Rust Sail compiler"
license = "MIT OR Apache-2.0"

[lib]
name = "sail_prelude"
path = "src/lib.rs"

[dev-dependencies]
sail-parse = { path = "../sail-parse" }
sail-resolve = { path = "../sail-resolve" }

[lints]
workspace = true
