[workspace]
members = ["crates/sail-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
# MSRV-Pin (Lane 15): minimal unterstuetzte Rust-Version.
rust-version = "1.75.0"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
