[workspace]
members = [
    "crates/sail-ast",
    "crates/sail-parse",
    "crates/sail-resolve",
    "crates/sail-nexp",
    "crates/sail-ty",
    "crates/sail-solver",
    "crates/sail-rewrite",
    "crates/sail-effects",
    "crates/sail-lower",
    "crates/sail-lean",
    "crates/sail-lake",
    "crates/sail-oracle",
    "crates/sail-perf",
    "crates/sail-shard",
    "crates/sail-cli",
    "crates/sail-lex",
    "crates/sail-prelude",
    "crates/sail-regs",
    "crates/sail-mapping",
    "crates/sail-patterns",
    "crates/sail-bitvec",
    "crates/sail-int",
    "crates/sail-real",
    "crates/sail-extern",
    "crates/sail-termination",
    "crates/sail-loops",
    "crates/sail-grammar",
    "crates/sail-except",
    "crates/sail-archsem",
    "crates/sail-sysregs-shard",
    "crates/sail-sve-sme",
    "crates/sail-instrs-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
# MSRV-Pin (Lane 15): minimal unterstuetzte Rust-Version.
# CI prueft mit genau dieser Toolchain (`MSRV`-Job in ci.yml).
rust-version = "1.75.0"
license = "MIT OR Apache-2.0"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
